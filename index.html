<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Intro</title>
    <style>
        *{
            background-color: powderblue;
        }
        ul li{
            background-color: white;
        }
        .argentina{
            color: blue;
            font-weight: 900;
        }
        #sublist{
            color: brown;
        }
    </style>
</head>
<body>
    <nav></nav>
    <header></header>
    <main>
        <section>
            <h1 style="color: red;">This is a simple paragraph</h1>
            <p><strong style="color: blueviolet;">This text is bold.</strong> <em style="color:darkgreen;">This text is italicized</em></p>
            <ol>
                <li class="argentina" style="color: red;">First item</li>
                <li>Second item</li>
                <li id="sublist" style="color: red;">Second item</li>
                <li>Second item</li>
                <li class="argentina">Second item</li>
            </ol>
            <ul style="background-color: white; width: 140px; height: 50px; align-items: center; align-content: center; border-radius: 25px;">
                <li>Unordered item1</li>
                <li>Unordered item2</li>
            </ul>
        </section>
    </main>
    <footer></footer>
</body>
</html>
